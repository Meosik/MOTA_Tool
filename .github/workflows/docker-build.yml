name: Build and Publish Images

on:
  push:
    branches: [ main, feature/map_table ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
      IMAGE_BACKEND: ${{ github.repository }}-backend
      IMAGE_FRONTEND: ${{ github.repository }}-frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (optional for multi-arch)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ghcr.io/${{ env.IMAGE_BACKEND }}:latest

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ghcr.io/${{ env.IMAGE_FRONTEND }}:latest

      - name: Summary
        run: |
          echo "Backend image: ghcr.io/${IMAGE_BACKEND}:latest" >> $GITHUB_STEP_SUMMARY
          echo "Frontend image: ghcr.io/${IMAGE_FRONTEND}:latest" >> $GITHUB_STEP_SUMMARY
