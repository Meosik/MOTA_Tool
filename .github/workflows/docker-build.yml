name: Build and Publish Images

on:
  push:
    branches: [ main, feature/map_table ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Derive lowercase owner & repo
        id: vars
        run: |
          owner_lc="${GITHUB_REPOSITORY_OWNER,,}"
          repo_lc="${GITHUB_REPOSITORY##*/}"
          repo_lc="${repo_lc,,}"
          # sanitize repo name: replace underscores with hyphens for image clarity
          repo_lc="${repo_lc//_/ -}"
          echo "owner=${owner_lc}" >> $GITHUB_OUTPUT
          echo "repo=${repo_lc}" >> $GITHUB_OUTPUT
          echo "backend_image=${owner_lc}/${repo_lc}-backend" >> $GITHUB_OUTPUT
          echo "frontend_image=${owner_lc}/${repo_lc}-frontend" >> $GITHUB_OUTPUT

      - name: Set up QEMU (optional for multi-arch)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ghcr.io/${{ steps.vars.outputs.backend_image }}:latest

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ghcr.io/${{ steps.vars.outputs.frontend_image }}:latest

      - name: Summary
        run: |
          echo "Backend image: ghcr.io/${{ steps.vars.outputs.backend_image }}:latest" >> $GITHUB_STEP_SUMMARY
          echo "Frontend image: ghcr.io/${{ steps.vars.outputs.frontend_image }}:latest" >> $GITHUB_STEP_SUMMARY
